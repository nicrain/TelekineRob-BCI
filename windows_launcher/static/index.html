<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System Control</title>
<style>
  /* Ferrari-inspired dark theme — mirrors web_gui/src/styles.css tokens */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --f-red:#DA291C; --f-red-dark:#B01E0A;
    --f-black:#000000; --f-near-black:#181818;
    --f-surface:#1e1e1e; --f-input-bg:#0c0c0c;
    --f-border-subtle:#1a1a1a; --f-border-strong:#2a2a2a; --f-border-mid:#333333;
    --f-text-primary:#FFFFFF; --f-text-secondary:#969696;
    --f-ok:#03904A; --f-warn:#F13A2C; --f-info:#4C98B9;
    --f-hover-bg:rgba(255,255,255,0.08);
    --f-status-off:#3a3a3a;
    --font-display:'Space Grotesk',Arial,Helvetica,sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
    --radius:2px;   /* razor */
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; font-family:var(--font-display); font-size:14px; color:var(--f-text-primary); background:var(--f-black); }
  #app { display:flex; height:100vh; }

  /* ---------- sidebar (P2: collapsible) ---------- */
  #sidebar {
    width:250px; min-width:250px; background:var(--f-black); border-right:1px solid var(--f-border-strong);
    display:flex; flex-direction:column; padding:14px 10px; gap:6px; overflow-y:auto;
    transition:width .2s ease, min-width .2s ease, padding .2s ease;
  }
  #sidebar.collapsed { width:0; min-width:0; padding:0; border-right:none; overflow:hidden; }
  #sidebar h1 {
    font-family:var(--font-mono); font-size:13px; letter-spacing:2px; text-transform:uppercase;
    color:var(--f-text-primary); margin-bottom:8px;
  }
  .group-label {
    font-family:var(--font-mono); font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--f-text-secondary); margin:10px 0 4px;
  }
  .item {
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:var(--f-surface); border:1px solid var(--f-border-strong); border-radius:var(--radius);
  }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--f-status-off); flex:none; }
  .dot.on   { background:var(--f-ok); }
  .dot.busy { background:var(--f-warn); animation:blink 1s infinite; }
  .dot.err  { background:var(--f-warn); }
  .item .label { flex:1; }
  .btn {
    border:1px solid var(--f-border-mid); background:transparent; color:var(--f-text-primary);
    border-radius:var(--radius); padding:5px 10px; cursor:pointer;
    font-family:var(--font-display); font-size:13px;
  }
  .btn:hover:not(:disabled) { background:var(--f-hover-bg); border-color:var(--f-text-secondary); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.danger { color:var(--f-red); border-color:var(--f-red-dark); }
  .btn.danger:hover:not(:disabled) { background:rgba(218,41,28,.12); }
  @keyframes blink { 50% { opacity:.35; } }

  /* ---------- message bar ---------- */
  #msg {
    position:fixed; bottom:14px; left:270px; right:14px; z-index:20;
    background:var(--f-near-black); border:1px solid var(--f-info); border-radius:var(--radius);
    padding:10px 14px; display:none; font-size:13px; color:var(--f-text-primary);
  }
  #msg.error { border-color:var(--f-warn); color:var(--f-warn); background:#1a0c0c; }
  #msg .close { float:right; cursor:pointer; color:var(--f-text-secondary); }

  /* ---------- main ---------- */
  #main { flex:1; display:flex; flex-direction:column; }
  #mainbar {
    display:flex; align-items:center; gap:10px; padding:8px 14px;
    background:var(--f-black); border-bottom:1px solid var(--f-border-strong); font-size:13px;
  }
  #mainbar a { color:var(--f-info); text-decoration:none; }
  #mainbar a:hover { text-decoration:underline; }
  #collapse-btn { flex:none; min-width:32px; }
  iframe { flex:1; border:none; width:100%; }
  .placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--f-text-secondary); }
</style>
</head>
<body>
<div id="app">
  <!-- ============ Sidebar (default skeleton; re-rendered from /config) ============ -->
  <aside id="sidebar">
    <h1>System Control</h1>
    <div class="group-label">Status</div>
    <div class="item" id="item-system">
      <span class="dot"></span><span class="label">System State</span>
      <span class="sys-state">Not Connected</span>
    </div>
    <div class="group-label">Devices</div>
    <div id="devices-list"></div>
    <div class="group-label">Operations</div>
    <div id="ops-list"></div>
    <div class="group-label">Log</div>
    <button class="btn" id="log-btn" disabled>View Log</button>
  </aside>

  <!-- ============ Main: web GUI iframe ============ -->
  <main id="main">
    <div id="mainbar">
      <!-- P2: collapse button lives in the static #mainbar -->
      <button id="collapse-btn" class="btn" onclick="toggleSidebar()" title="Collapse / expand sidebar">«</button>
      <span>Experiment</span>
      <!-- P5: refresh the (cross-origin) web GUI iframe -->
      <button id="refresh-btn" class="btn" onclick="refreshFrame()" title="Reload the web GUI">↻ Refresh</button>
      <a id="open-new" href="http://localhost:5173" target="_blank">Open in new tab</a>
    </div>
    <iframe id="frame" title="web GUI"></iframe>
  </main>
</div>

<div id="msg"><span class="close" onclick="hideMsg()">✕</span><span id="msg-text"></span></div>

<script>
"use strict";

const G = { config: null, status: null, webUrl: "http://localhost:5173", prevRunning: false };

/* ---------- Default skeleton (file:// preview still looks sane) ---------- */
const DEFAULT_DEVICES = [
  { id: "headband", label: "Headband",     type: "device" },
  { id: "hybrid",   label: "HybridBlack",  type: "device" },
  { id: "thymio",   label: "Thymio",       type: "device" },
];
const DEFAULT_OPS = [
  { id: "start-system", label: "Start System",  type: "action" },
  { id: "restart-web",  label: "Restart Web",   type: "action" },
  { id: "stop-system",  label: "Stop System",   type: "action" },
  { id: "exit",         label: "Exit Launcher", type: "action" },
];

/* ---------- Sidebar collapse (P2) ---------- */
/* The fold lives on #sidebar's class and the button in #mainbar — neither
   is inside the renderDevices/renderOps re-render containers, so the 1.5s
   poll never resets it. */
function sidebarCollapsed() {
  return localStorage.getItem("launcherSidebarCollapsed") === "1";
}
function applySidebarState() {
  const collapsed = sidebarCollapsed();
  document.getElementById("sidebar").classList.toggle("collapsed", collapsed);
  document.getElementById("collapse-btn").textContent = collapsed ? "»" : "«";
}
function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const collapsed = sidebar.classList.toggle("collapsed");
  localStorage.setItem("launcherSidebarCollapsed", collapsed ? "1" : "0");
  document.getElementById("collapse-btn").textContent = collapsed ? "»" : "«";
}

/* ---------- State → style ---------- */
function dotClass(st) {
  const map = {
    running: "on", connected: "on",
    starting: "busy", stopping: "busy", connecting: "busy", disconnecting: "busy",
    error: "err",
  };
  return map[st] || "";
}
function sysLabel(st) {
  const map = { stopped: "Stopped", starting: "Starting…", running: "Running", stopping: "Stopping…", error: "Error" };
  return map[st] || st || "Not Connected";
}
function devLabel(st) {
  const map = { disconnected: "Not Connected", connecting: "Connecting…", connected: "Connected", disconnecting: "Disconnecting…", error: "Failed" };
  return map[st] || st || "Not Connected";
}
function showMsg(text, isError) {
  const m = document.getElementById("msg");
  document.getElementById("msg-text").textContent = text;
  m.className = isError ? "error" : "";
  m.style.display = "block";
}
function hideMsg() { document.getElementById("msg").style.display = "none"; }

/* ---------- API ---------- */
async function api(path, body) {
  const opts = { method: body ? "POST" : "GET", headers: body ? { "Content-Type": "application/json" } : {} };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  return resp.json();
}

/* ---------- Render ---------- */
function renderDevices() {
  const list = document.getElementById("devices-list");
  list.innerHTML = "";
  const devices = (G.config && G.config.groups
    ? G.config.groups.find(g => g.id === "devices")?.items || DEFAULT_DEVICES
    : DEFAULT_DEVICES);
  devices.forEach(d => {
    const st = G.status ? (G.status.devices[d.id]?.state || "disconnected") : "disconnected";
    const sysUp = G.status && ["running", "starting"].includes(G.status.system.state);
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML =
      `<span class="dot ${dotClass(st)}"></span>` +
      `<span class="label">${d.label}</span>` +
      `<button class="btn" data-id="${d.id}" data-on="${st === "connected"}">${st === "connected" ? "Disconnect" : "Connect"}</button>`;
    const btn = div.querySelector("button");
    btn.disabled = !sysUp;               // §1.3: devices locked until system is up
    btn.onclick = () => toggleDevice(d.id, btn.dataset.on === "true");
    list.appendChild(div);
  });
}

function renderOps() {
  const list = document.getElementById("ops-list");
  list.innerHTML = "";
  const ops = (G.config && G.config.groups
    ? G.config.groups.find(g => g.id === "ops")?.items || DEFAULT_OPS
    : DEFAULT_OPS);
  ops.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "btn" + (["stop-system", "exit"].includes(o.id) ? " danger" : "");
    btn.textContent = o.label;
    btn.id = "op-" + o.id;
    btn.style.width = "100%";
    btn.onclick = () => runAction(o.id);
    list.appendChild(btn);
  });
}

function renderSystem() {
  const item = document.getElementById("item-system");
  if (!G.status) return;
  const s = G.status.system;
  const dot = item.querySelector(".dot");
  dot.className = "dot " + dotClass(s.state);
  const lbl = item.querySelector(".sys-state");
  lbl.textContent = sysLabel(s.state);
  if (s.message) lbl.title = s.message;
  const ops = G.status.system.state;
  const startBtn = document.getElementById("op-start-system");
  const stopBtn = document.getElementById("op-stop-system");
  const restartBtn = document.getElementById("op-restart-web");
  if (startBtn) startBtn.disabled = !["stopped", "error"].includes(ops);
  if (stopBtn) stopBtn.disabled = !["running", "starting", "error"].includes(ops);
  if (restartBtn) restartBtn.disabled = !["running", "error"].includes(ops);
}

/* ---------- Actions ---------- */
async function toggleDevice(id, currentlyOn) {
  const path = currentlyOn ? "/disconnect-device" : "/connect-device";
  const r = await api(path, { device: id });
  showMsg(r.message || (r.ok ? "Done" : "Failed"), !r.ok);
}
async function runAction(id) {
  const path = { "start-system": "/start-system", "restart-web": "/restart-web", "stop-system": "/stop-system", "exit": "/shutdown" }[id];
  if (!path) return;
  // Empty JSON body forces POST: api() picks the method by body presence,
  // so a bare api(path) would send GET → the server only has POST routes
  // → 404 "Unknown path".
  const r = await api(path, {});
  showMsg(r.message || (r.ok ? "Done" : "Failed"), !r.ok);
  pollStatus();   // refresh immediately
}

/* ---------- Polling ---------- */
async function pollStatus() {
  try {
    G.status = await api("/status");
  } catch {
    showMsg("Cannot reach the control service — is it running?", true);
    return;
  }
  renderSystem(); renderDevices(); renderOps();
  // Auto-load the web GUI after startup: detect the non-running → running
  // transition and force-reload the iframe (running only — the launcher's
  // ready-check confirms the frontend is up before setting running, so
  // reloading during starting would hit a dead frontend and never re-fire).
  const running = G.status && G.status.system.state === "running";
  if (running && !G.prevRunning) {
    refreshFrame();
  }
  G.prevRunning = running;
}

/* ---------- iframe (cross-origin safe reload + §5 fallback) ---------- */
function refreshFrame() {
  // The web GUI is cross-origin (5173 vs the control service), so
  // contentWindow.location.reload() would throw — re-point src instead.
  const frame = document.getElementById("frame");
  frame.src = "about:blank";   // clear, force a fresh load
  frame.src = G.webUrl;        // re-point (works whether the GUI is up or not)
  frame.style.display = "block";
}
function setupFrame() {
  const frame = document.getElementById("frame");
  const link = document.getElementById("open-new");
  link.href = G.webUrl;
  frame.src = G.webUrl;
  frame.onload = () => { frame.style.display = "block"; };
  frame.onerror = () => { frame.style.display = "none"; };  // X-Frame-Options refusal → link only
}

/* ---------- Init ---------- */
async function init() {
  applySidebarState();
  setupFrame();
  renderDevices(); renderOps();
  try {
    const cfg = await api("/config");
    G.config = cfg;
    G.webUrl = cfg.web_url || G.webUrl;
    const log = cfg.log;
    const logBtn = document.getElementById("log-btn");
    if (log) { logBtn.textContent = log.label; logBtn.disabled = !log.placeholder; }
    setupFrame();
    renderDevices(); renderOps();
  } catch { /* file:// preview: keep the default skeleton */ }
  pollStatus();
  setInterval(pollStatus, 1500);
}
init();
</script>
</body>
</html>
